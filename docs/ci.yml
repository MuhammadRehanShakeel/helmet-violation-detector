name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: Install (no SQL Server or trained model needed for the tests)
        run: |
          grep -v pyodbc backend/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt pip-audit
      - name: Tests (security, rules, tracking, plates, API)
        working-directory: backend
        run: python -m pytest tests -q -p no:warnings
      - name: Number-plate OCR evaluation (400 held-out synthetic plates)
        run: python evaluation/eval_plates.py test
      - name: Dependency audit
        run: pip-audit -r /tmp/req.txt || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci && npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan files for leaked passwords / keys (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --no-git --config /repo/.gitleaks.toml --redact -v
